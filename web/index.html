<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Core Activity</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --track: #f0efec;
    --border: rgba(11, 11, 11, 0.10);
    --series-user: #2a78d6;
    --series-system: #eb6834;
    --good: #0ca30c;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --track: #262624;
      --border: rgba(255, 255, 255, 0.10);
      --series-user: #3987e5;
      --series-system: #d95926;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --track: #262624;
    --border: rgba(255, 255, 255, 0.10);
    --series-user: #3987e5;
    --series-system: #d95926;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  h2 { font-size: 15px; margin: 0; font-weight: 600; }
  .meta { color: var(--text-secondary); margin: 0; flex: 1 1 auto; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 13px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .status[data-state="live"]::before { background: var(--good); }
  .status[data-state="down"]::before { background: var(--critical); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile, .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .tile { padding: 14px 16px; }
  .tile .label { color: var(--text-secondary); font-size: 13px; }
  .tile .value { font-size: 32px; font-weight: 650; line-height: 1.2; margin-top: 2px; }
  .tile .sub { color: var(--text-muted); font-size: 12px; }
  .card { padding: 16px; margin-bottom: 16px; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 12px; }
  .legend { display: flex; gap: 14px; color: var(--text-secondary); font-size: 12px; align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .group + .group { margin-top: 14px; }
  .group-title { color: var(--text-secondary); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
  .row { display: grid; grid-template-columns: 36px 1fr 52px; align-items: center; gap: 10px; height: 22px; }
  .row .name { color: var(--text-secondary); font-size: 12px; font-variant-numeric: tabular-nums; }
  .row .pct { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .track { position: relative; height: 12px; background: var(--track); border-radius: 4px; display: flex; gap: 2px; overflow: hidden; }
  .seg { height: 100%; transition: width 0.35s ease; }
  .seg.user { background: var(--series-user); }
  .seg.system { background: var(--series-system); border-radius: 0 4px 4px 0; }
  .seg[style*="width: 0%"] { display: none; }
  .scale { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 12px; }
  .scale .ramp { width: 140px; height: 10px; border-radius: 3px; }
  .heatmap-wrap { position: relative; }
  canvas { display: block; width: 100%; }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  th { color: var(--text-secondary); font-weight: 600; }
  .tooltip {
    position: fixed; pointer-events: none; z-index: 10; display: none;
    background: var(--surface); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .tooltip b { font-weight: 600; }
  .tooltip .muted { color: var(--text-secondary); }
  .empty { color: var(--text-muted); padding: 12px 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Core activity</h1>
    <p class="meta" id="meta">Connecting…</p>
    <span class="status" id="status">Connecting</span>
  </header>

  <section class="tiles" id="tiles"></section>

  <section class="card">
    <div class="card-head">
      <h2>Right now</h2>
      <div class="legend" aria-label="Legend">
        <span><i class="swatch" style="background: var(--series-user)"></i>User</span>
        <span><i class="swatch" style="background: var(--series-system)"></i>System</span>
      </div>
    </div>
    <div id="bars"><div class="empty">Waiting for the first sample…</div></div>
  </section>

  <section class="card">
    <div class="card-head">
      <h2 id="history-title">History</h2>
      <div class="scale"><span>0%</span><i class="ramp" id="ramp"></i><span>100% busy</span></div>
    </div>
    <div class="heatmap-wrap"><canvas id="heatmap" role="img" aria-label="Per-core busy percentage over time"></canvas></div>
  </section>

  <section class="card">
    <details>
      <summary>Table view</summary>
      <table>
        <thead><tr><th>Core</th><th>Type</th><th>Busy %</th><th>User %</th><th>System %</th><th>Nice %</th><th>Idle %</th></tr></thead>
        <tbody id="table"></tbody>
      </table>
    </details>
  </section>
</main>
<div class="tooltip" id="tooltip"></div>

<script>
(() => {
  const TYPE_NAMES = { P: "Performance", E: "Efficiency" };
  // Sequential blue ramp, near-zero -> full. Dark mode runs it so low values recede into the surface.
  const RAMP = ["#cde2fb", "#b7d3f6", "#9ec5f4", "#86b6ef", "#6da7ec", "#5598e7", "#3987e5",
                "#2a78d6", "#256abf", "#1c5cab", "#184f95", "#104281", "#0d366b"];
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => {
    const forced = document.documentElement.dataset.theme;
    return forced ? forced === "dark" : dark.matches;
  };
  const ramp = () => (isDark() ? [...RAMP].reverse() : RAMP);

  const $ = (id) => document.getElementById(id);
  const tooltip = $("tooltip");
  const canvas = $("heatmap");
  let state = null;
  let hoverCell = null;

  const fmt = (v) => (v == null ? "—" : `${v.toFixed(1)}%`);
  const round = (v) => (v == null ? "—" : `${Math.round(v)}%`);
  const label = (core) => (core.type ? `${core.type}${core.id}` : `${core.id}`);
  const average = (values) => {
    const known = values.filter((v) => v != null);
    return known.length ? known.reduce((a, b) => a + b, 0) / known.length : null;
  };

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function colorFor(percent) {
    const steps = ramp();
    const t = Math.max(0, Math.min(1, percent / 100)) * (steps.length - 1);
    const i = Math.min(steps.length - 2, Math.floor(t));
    const a = hexToRgb(steps[i]), b = hexToRgb(steps[i + 1]), f = t - i;
    return `rgb(${a.map((c, k) => Math.round(c + (b[k] - c) * f)).join(",")})`;
  }

  // Performance cores first, then efficiency, then untyped; stable by id within a group.
  function groups(cores) {
    const order = ["P", "E", null];
    return order
      .map((type) => ({ type, cores: cores.filter((c) => (c.type || null) === type) }))
      .filter((g) => g.cores.length);
  }

  function renderTiles(cores) {
    const tiles = [{ name: "All cores", cores }];
    for (const g of groups(cores))
      if (g.type) tiles.push({ name: `${TYPE_NAMES[g.type]} cores`, cores: g.cores });
    $("tiles").replaceChildren(...tiles.map((t) => {
      const el = document.createElement("div");
      el.className = "tile";
      el.innerHTML = `<div class="label"></div><div class="value"></div><div class="sub"></div>`;
      el.querySelector(".label").textContent = t.name;
      el.querySelector(".value").textContent = round(average(t.cores.map((c) => c.busy)));
      el.querySelector(".sub").textContent = `${t.cores.length} logical core${t.cores.length === 1 ? "" : "s"} · average busy`;
      return el;
    }));
  }

  function renderBars(cores) {
    const bars = $("bars");
    if (bars.dataset.count !== String(cores.length)) {
      bars.dataset.count = cores.length;
      bars.replaceChildren(...groups(cores).map((g) => {
        const group = document.createElement("div");
        group.className = "group";
        const title = document.createElement("div");
        title.className = "group-title";
        title.textContent = g.type ? `${TYPE_NAMES[g.type]} cores` : "Cores";
        group.append(title);
        for (const core of g.cores) {
          const row = document.createElement("div");
          row.className = "row";
          row.dataset.id = core.id;
          row.innerHTML = `<span class="name"></span><div class="track"><i class="seg user"></i><i class="seg system"></i></div><span class="pct"></span>`;
          row.querySelector(".name").textContent = label(core);
          row.addEventListener("mousemove", (e) => showCoreTip(e, Number(row.dataset.id)));
          row.addEventListener("mouseleave", hideTip);
          group.append(row);
        }
        return group;
      }));
    }
    for (const core of cores) {
      const row = bars.querySelector(`.row[data-id="${core.id}"]`);
      if (!row) continue;
      // Nice time is user-level work at lowered priority, so it joins the user segment.
      const user = (core.user ?? 0) + (core.nice ?? 0);
      row.querySelector(".seg.user").style.width = `${user}%`;
      row.querySelector(".seg.system").style.width = `${core.system ?? 0}%`;
      row.querySelector(".pct").textContent = fmt(core.busy);
    }
  }

  function renderTable(cores) {
    $("table").replaceChildren(...cores.map((c) => {
      const tr = document.createElement("tr");
      for (const v of [label(c), c.type ? TYPE_NAMES[c.type] : "—", c.busy, c.user, c.system, c.nice, c.idle]) {
        const td = document.createElement("td");
        td.textContent = typeof v === "number" || v === null ? (v == null ? "—" : v.toFixed(1)) : v;
        tr.append(td);
      }
      return tr;
    }));
  }

  // Heatmap geometry, shared by drawing and hit-testing.
  const ROW = 16, ROW_GAP = 2, GROUP_GAP = 10, GUTTER = 44, AXIS = 22;
  function layout() {
    const rows = [];
    let y = 0;
    groups(state.cores).forEach((g, gi) => {
      if (gi) y += GROUP_GAP;
      for (const core of g.cores) {
        rows.push({ core, index: state.cores.indexOf(core), y });
        y += ROW + ROW_GAP;
      }
    });
    const width = canvas.clientWidth;
    // A fixed window keeps cell size stable while history fills in from the right.
    const columns = Math.max(1, state.capacity || 0, ...state.history.map((h) => h.length));
    const cell = (width - GUTTER) / columns;
    return { rows, width, height: y - ROW_GAP + AXIS, columns, cell };
  }

  function drawHeatmap() {
    if (!state || !state.cores.length) return;
    const geo = layout();
    const dpr = window.devicePixelRatio || 1;
    canvas.style.height = `${geo.height}px`;
    canvas.width = Math.round(geo.width * dpr);
    canvas.height = Math.round(geo.height * dpr);
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);
    const css = getComputedStyle(document.documentElement);
    const muted = css.getPropertyValue("--text-muted").trim();
    const secondary = css.getPropertyValue("--text-secondary").trim();
    const track = css.getPropertyValue("--track").trim();
    ctx.font = "12px system-ui, -apple-system, sans-serif";
    ctx.textBaseline = "middle";
    for (const r of geo.rows) {
      ctx.fillStyle = secondary;
      ctx.fillText(label(r.core), 0, r.y + ROW / 2);
      const series = state.history[r.index] || [];
      const offset = geo.columns - series.length; // right-align so the newest sample sits at "now"
      series.forEach((v, j) => {
        ctx.fillStyle = v == null ? track : colorFor(v);
        const x = GUTTER + (offset + j) * geo.cell;
        ctx.fillRect(x, r.y, Math.max(1, geo.cell - 1), ROW);
      });
    }
    if (hoverCell) {
      const r = geo.rows.find((row) => row.index === hoverCell.index);
      if (r) {
        ctx.strokeStyle = css.getPropertyValue("--text-primary").trim();
        ctx.lineWidth = 1.5;
        ctx.strokeRect(GUTTER + hoverCell.column * geo.cell, r.y - 0.5, Math.max(1, geo.cell - 1), ROW + 1);
      }
    }
    // Time axis: label every 30 s back from now.
    const axisY = geo.height - AXIS / 2 + 3;
    ctx.fillStyle = muted;
    ctx.textAlign = "right";
    ctx.fillText("now", geo.width, axisY);
    const step = Math.max(1, Math.round(30 / state.interval));
    for (let back = step; back < geo.columns; back += step) {
      const x = GUTTER + (geo.columns - back) * geo.cell;
      ctx.textAlign = "center";
      ctx.fillText(`−${Math.round(back * state.interval)} s`, x, axisY);
    }
    ctx.textAlign = "left";
  }

  function showTip(e, html) {
    tooltip.innerHTML = html;
    tooltip.style.display = "block";
    const pad = 14, w = tooltip.offsetWidth, h = tooltip.offsetHeight;
    let x = e.clientX + pad, y = e.clientY + pad;
    if (x + w > innerWidth - 8) x = e.clientX - w - pad;
    if (y + h > innerHeight - 8) y = e.clientY - h - pad;
    tooltip.style.left = `${Math.max(8, x)}px`;
    tooltip.style.top = `${Math.max(8, y)}px`;
  }
  function hideTip() { tooltip.style.display = "none"; }

  function showCoreTip(e, id) {
    const c = state.cores.find((core) => core.id === id);
    if (!c) return;
    const kind = c.type ? ` · ${TYPE_NAMES[c.type]}` : "";
    showTip(e, `<b>Core ${label(c)}</b><span class="muted">${kind}</span><br>
      Busy <b>${fmt(c.busy)}</b><br>
      <span class="muted">User ${fmt(c.user)} · System ${fmt(c.system)} · Nice ${fmt(c.nice)} · Idle ${fmt(c.idle)}</span>`);
  }

  canvas.addEventListener("mousemove", (e) => {
    if (!state) return;
    const geo = layout();
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    const row = geo.rows.find((r) => y >= r.y - ROW_GAP / 2 && y < r.y + ROW + ROW_GAP / 2);
    const column = Math.floor((x - GUTTER) / geo.cell);
    const series = row ? state.history[row.index] || [] : [];
    const j = column - (geo.columns - series.length);
    if (!row || x < GUTTER || j < 0 || j >= series.length) {
      if (hoverCell) { hoverCell = null; drawHeatmap(); }
      hideTip();
      return;
    }
    hoverCell = { index: row.index, column };
    drawHeatmap();
    const ago = Math.round((series.length - 1 - j) * state.interval);
    showTip(e, `<b>Core ${label(row.core)}</b> <span class="muted">${ago ? `${ago} s ago` : "now"}</span><br>Busy <b>${fmt(series[j])}</b>`);
  });
  canvas.addEventListener("mouseleave", () => { hoverCell = null; hideTip(); drawHeatmap(); });

  function paintRampLegend() {
    $("ramp").style.background = `linear-gradient(to right, ${ramp().join(",")})`;
  }

  function render() {
    const cores = state.cores;
    const counts = groups(cores).filter((g) => g.type).map((g) => `${g.cores.length} ${TYPE_NAMES[g.type]}`);
    $("meta").textContent = `${cores.length} logical cores${counts.length ? ` · ${counts.join(" · ")}` : ""} · sampled every ${state.interval} s`;
    const seconds = Math.round(Math.max(1, state.capacity || 0, ...state.history.map((h) => h.length)) * state.interval);
    $("history-title").textContent = seconds >= 90 ? `Last ${Math.round(seconds / 60)} minutes` : `Last ${seconds} seconds`;
    renderTiles(cores);
    renderBars(cores);
    renderTable(cores);
    drawHeatmap();
  }

  function setStatus(kind, text) {
    const el = $("status");
    el.dataset.state = kind;
    el.textContent = text;
  }

  async function poll() {
    let delay = 1000;
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3000);
      const response = await fetch("/api/stats", { cache: "no-store", signal: controller.signal });
      clearTimeout(timer);
      if (!response.ok) throw new Error(response.statusText);
      state = await response.json();
      delay = state.interval * 1000;
      setStatus("live", "Live");
      render();
    } catch {
      setStatus("down", "Disconnected — is resource-web running?");
    }
    setTimeout(poll, delay);
  }

  dark.addEventListener("change", () => { paintRampLegend(); drawHeatmap(); });
  new ResizeObserver(() => drawHeatmap()).observe(canvas.parentElement);
  paintRampLegend();
  poll();
})();
</script>
</body>
</html>
